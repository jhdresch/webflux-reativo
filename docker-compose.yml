
services:

  mongo:
    image: mongo:6.0
    container_name: webflux_mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}

    volumes:
      - ./data/mongo:/data/db
      - ./docker/mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro

    # map HOST:${MONGO_EXTERNAL_PORT} -> CONTAINER:${MONGO_INTERNAL_PORT}
    command: ["mongod", "--bind_ip_all", "--port", "${MONGO_INTERNAL_PORT}"]
    ports:
      - "${MONGO_EXTERNAL_PORT}:${MONGO_INTERNAL_PORT}"

    healthcheck:
      test: ["CMD", "mongosh", "--port", "${MONGO_INTERNAL_PORT}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - webflux_network


  app:
    image: maven:3.8.8-openjdk-17
    container_name: webflux_app
    working_dir: /workspace
    restart: unless-stopped

    depends_on:
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # Constrói a URI com credenciais (importante se o Mongo tiver auth)
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:${MONGO_INTERNAL_PORT}/${MONGO_INITDB_DATABASE}?authSource=admin
      - SERVER_PORT=${APP_PORT}

    ports:
      - "${APP_PORT}:${APP_PORT}"

    volumes:
      - ./:/workspace:cached
      - m2_repo:/root/.m2

    command: >
      sh -c "
        echo 'Aguardando MongoDB em mongo:${MONGO_INTERNAL_PORT}...' &&
        sleep 5 &&
        mvn -f pom.xml clean package -DskipTests &&
        echo 'URI MongoDB: '${SPRING_DATA_MONGODB_URI} &&
        java -jar target/*.jar
      "

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - webflux_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.3
    container_name: webflux_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=webflux-cluster
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_EXTERNAL_PORT}:${ELASTICSEARCH_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:${ELASTICSEARCH_INTERNAL_PORT}/_cluster/health | grep -q '"status"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - webflux_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.3
    container_name: webflux_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:${ELASTICSEARCH_INTERNAL_PORT}
      - SERVER_NAME=kibana
    ports:
      - "${KIBANA_EXTERNAL_PORT}:${KIBANA_INTERNAL_PORT}"
    depends_on:
      - elasticsearch
    networks:
      - webflux_network

  es-init:
    image: curlimages/curl:8.4.0
    container_name: webflux_es_init
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ES_URL=${SPRING_ELASTICSEARCH_URI}
    volumes:
      - ./docker/es-init/init-es.sh:/scripts/init-es.sh:ro
    command: ["sh", "/scripts/init-es.sh"]
    restart: "no"
    networks:
      - webflux_network


networks:
  webflux_network:
    driver: bridge

volumes:
  m2_repo: